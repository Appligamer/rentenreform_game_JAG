name: Build Web, macOS, iOS & Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  web:
    name: Web Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate macOS & iOS shell scripts
        run: |
          bash -n launchers/START_GAME_MAC.command
          bash -n launchers/START_GAME_IOS.command
          bash -n launchers/run_game_mac.sh
          bash -n launchers/GenerationZukunft.app/Contents/MacOS/GenerationZukunft

      - name: TypeScript lint check
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: generation-zukunft-web-dist
          path: web/dist/
          retention-days: 14

  apple:
    name: Apple macOS & iOS/iPadOS Xcode Builds
    runs-on: macos-latest
    needs: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundle
        uses: actions/download-artifact@v4
        with:
          name: generation-zukunft-web-dist
          path: web/dist

      - name: Sync WebBundle into macOS and iOS Runners
        run: |
          rm -rf platforms/macos/Runner/WebBundle platforms/ios/Runner/WebBundle
          mkdir -p platforms/macos/Runner/WebBundle platforms/ios/Runner/WebBundle
          cp -R web/dist/. platforms/macos/Runner/WebBundle/
          cp -R web/dist/. platforms/ios/Runner/WebBundle/

      - name: Build macOS app with Xcode (macOS-only)
        run: |
          xcodebuild \
            -project GenerationZukunft_macOS.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos-derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build iOS & iPadOS Simulator app with Xcode
        run: |
          xcodebuild \
            -project GenerationZukunft_iOS.xcodeproj \
            -scheme GenerationZukunft_iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package macOS .app artifact
        run: |
          APP_PATH="$(find build/macos-derived/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Built macOS .app bundle not found."
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/GenerationZukunft_macOS.app.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: generation-zukunft-macos-app
          path: artifacts/GenerationZukunft_macOS.app.zip
          retention-days: 14

  windows:
    name: Windows Standalone EXE Build
    runs-on: windows-latest
    needs: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web bundle
        uses: actions/download-artifact@v4
        with:
          name: generation-zukunft-web-dist
          path: web/dist

      - name: Build GenerationZukunft.exe
        shell: powershell
        run: |
          .\scripts\build_windows_portable.ps1 -SkipSign

      - name: Upload Windows .exe & Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: generation-zukunft-windows-exe
          path: |
            dist_windows/GenerationZukunft.exe
            dist_windows/GenerationZukunft_Windows_Portable.zip
          retention-days: 14
