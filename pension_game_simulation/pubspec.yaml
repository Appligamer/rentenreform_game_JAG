name: pension_game_simulation
description: "Cross-Platform Video Game & Simulation Core for the German Pension Insurance System (Rentenpaket II, Generationenkapital, econo=me)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  provider: ^6.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/cards/
    - assets/images/icons/
    - assets/images/life/
    - assets/images/awards/
